<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Y+ Music</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">🎵 Y+ Music</div>
  <button onclick="toggleDark()">🌙</button>
</header>

<main>
  <h1>Music for you</h1>
  <p class="subtitle">Listen to your favorite music</p>

  <div class="search">
    🔎
    <input type="text" placeholder="Search music...">
  </div>

  <section>
    <h2>Spotify Playlist</h2>

    <iframe
      title="Spotify Playlist"
      src="https://open.spotify.com/embed/playlist/1GeZsDE8uvGtMZr23QU3HX?utm_source=generator&theme=0"
      width="100%"
      height="380"
      frameborder="0"
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      loading="lazy">
    </iframe>
  </section>
</main>

<footer>
  <span>🎵 Y+ Music</span>
  <span>No ads in this app</span>
</footer>

<script src="app.js"></script>

</body>
</html>
