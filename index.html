<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Y+ Music</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div class="brand">🎵 Y+ Music</div>
    <button id="themeBtn">🌙</button>
  </header>

  <main>

    <h1>Good music, good mood 🎧</h1>
    <p class="subtitle">Your music, your way.</p>

    <div class="searchBox">
      <span>🔎</span>
      <input id="searchInput" type="text" placeholder="Search in this playlist...">
    </div>

    <section class="card">
      <div class="sectionTitle">
        <div>
          <h2>My Playlist</h2>
          <p>Spotify playlist</p>
        </div>
        <span>🎶</span>
      </div>

      <iframe
        src="https://open.spotify.com/embed/playlist/67iR9mSL69o0SmQUu1p4HL?utm_source=generator&theme=0"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy">
      </iframe>
    </section>

    <section class="features">
      <div class="feature">
        <span>🎵</span>
        <b>Online Music</b>
        <small>Spotify playlist</small>
      </div>

      <div class="feature">
        <span>❤️</span>
        <b>Favorites</b>
        <small>Save your favorites</small>
      </div>

      <div class="feature">
        <span>📱</span>
        <b>Mobile Friendly</b>
        <small>Made for phone</small>
      </div>
    </section>

  </main>

  <footer>
    <p>Y+ Music • Powered by Spotify</p>
  </footer>

  <script src="app.js"></script>

</body>
</html>
